name: Tests und Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Wöchentlich neu bauen, damit Sicherheitsupdates des Basis-Images ankommen
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image lokal bauen und Startprobe
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pogo-kalender:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starten und prüfen
        run: |
          trap 'echo "--- Container-Log ---"; docker logs probe || true; docker rm -f probe >/dev/null 2>&1 || true' EXIT
          docker run -d --name probe -p 8080:8080 \
            -v "$PWD/config.json:/config/config.json:ro" \
            pogo-kalender:probe
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/pokemon-go-de.ics | grep -q "BEGIN:VCALENDAR"
          curl -fsS http://127.0.0.1:8080/ | grep -q "<html"
          uid=$(docker exec probe awk '/^Uid:/ {print $2}' /proc/1/status)
          echo "Server läuft mit UID $uid"
          test "$uid" != "0"

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Pokémon-GO-Eventkalender
            org.opencontainers.image.description=Pokémon-GO-Eventkalender (ScrapedDuck) mit Webansicht, iCal-Feed und manuellen Events

      - name: Bei GitHub Container Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
